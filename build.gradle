plugins {
	id 'java'
	id 'checkstyle'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'fbrissi.dev'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

repositories {
	mavenCentral()
}

checkstyle {
	configFile = file('config/checkstyle/checkstyle.xml')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
	test {
		java.srcDir 'src/test/unit/java'
	}
	integrationTest {
		java.srcDir 'src/test/integration/java'
		compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
	description = 'Runs integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	shouldRunAfter test
	useJUnitPlatform()
}

tasks.register('codeCoverageReport', JacocoReport) {
	description = 'Generates the combined code coverage report.'
	group = 'verification'
	dependsOn tasks.named('test'), tasks.named('integrationTest')
	executionData fileTree(layout.buildDirectory).include('jacoco/*.exec')
	sourceSets sourceSets.main
	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}
}

tasks.register('codeCoverageVerification', JacocoCoverageVerification) {
	description = 'Verifies the minimum code coverage.'
	group = 'verification'
	dependsOn tasks.named('codeCoverageReport')
	executionData fileTree(layout.buildDirectory).include('jacoco/*.exec')
	sourceSets sourceSets.main
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.965
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('integrationTest'), tasks.named('checkstyleIntegrationTest'), tasks.named('codeCoverageVerification')
}
